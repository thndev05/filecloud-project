# Whole stack. Values come from ./.env (see .env.example; deploy/setup.sh generates it).
# Every port is bound to 127.0.0.1: only the host Nginx (HTTPS) is public.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filecloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: filecloud
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filecloud -d filecloud"]
      interval: 5s
      retries: 10

  minio:
    # Official minio/minio images were removed from Docker Hub; pgsty/minio is a maintained community build
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://filecloud:${POSTGRES_PASSWORD}@postgres:5432/filecloud?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in .env}
      # Presigned share links are signed for this host, so it must be public
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-s3.${DOMAIN}}
      MINIO_PORT: ${MINIO_PORT:-443}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: filecloud
      FRONTEND_URL: ${FRONTEND_URL:-https://${DOMAIN}}
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:
  minio_data:
