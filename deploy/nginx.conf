# __DOMAIN__ is replaced by deploy/setup.sh. certbot adds the HTTPS blocks.

server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 100M;

    # Frontend container (serves the React build)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Backend container (prefix /api is stripped)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backend sets refresh cookie with path=/auth/refresh
        proxy_cookie_path /auth/refresh /api/auth/refresh;
    }

    # Realtime notifications (Socket.IO)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# MinIO container: presigned download links point here
server {
    listen 80;
    server_name s3.__DOMAIN__;

    client_max_body_size 100M;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
